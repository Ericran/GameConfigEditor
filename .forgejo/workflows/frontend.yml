name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` on purpose. It makes setup-node talk to the runner's
      # cache server, which hangs the job indefinitely on this self-hosted
      # runner rather than failing. `npm ci` here takes about 4 seconds, so the
      # cache was never buying much. Don't re-add it without checking a run
      # actually completes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Runs on the `wasm` label, which is a HOST-mode runner - steps execute
  # directly on the machine rather than in a job container. That is required,
  # not a preference: build.sh does `docker run -v "$PWD/frontend:/app"`, and
  # inside a container that path is resolved by the host daemon against the
  # host filesystem, where it does not exist. Host mode makes $PWD a real path,
  # so build.sh behaves exactly as it does when run by hand. the build host is also
  # where the node and tinygo images are already cached.
  plugin:
    if: github.event_name != 'pull_request'
    runs-on: wasm
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh

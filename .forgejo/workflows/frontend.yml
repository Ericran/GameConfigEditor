name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` on purpose. It makes setup-node talk to the runner's
      # cache server, which hangs the job indefinitely on this self-hosted
      # runner rather than failing. `npm ci` here takes about 4 seconds, so the
      # cache was never buying much. Don't re-add it without checking a run
      # actually completes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Needs the `wasm` label: a HOST-mode runner, where steps execute directly on
  # the machine rather than in a job container. That is a requirement, not a
  # preference - build.sh does `docker run -v "$PWD/frontend:/app"`, and from
  # inside a container that path is resolved by the host daemon against the host
  # filesystem, where it does not exist. Host mode makes $PWD a real path, so
  # build.sh behaves exactly as it does when run by hand. The runner also needs
  # Docker, since build.sh drives the Node and TinyGo images.
  #
  # The label names the capability, not a machine, so this file says nothing
  # about where it runs. build.sh puts its caches under the user's cache dir by
  # default, so no path needs configuring here either.
  plugin:
    if: github.event_name != 'pull_request'
    runs-on: wasm
    steps:
      - uses: actions/checkout@v4

      # A tag must agree with the VERSION file at the commit it points to.
      # build.sh warns about a stale VERSION locally, but it cannot warn here -
      # the checkout is shallow and carries no tags, so its `git describe` finds
      # nothing. This is what actually stops a mislabelled release: a v2026.8.6
      # release whose binary reports 2026.8.5 to the panel. Runs before the
      # build so it fails in seconds rather than after the wasm compile.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ver=$(tr -d '[:space:]' < VERSION)
          if [ "$TAG" != "v$ver" ]; then
            echo "!! tag $TAG does not match VERSION $ver - refusing to release" >&2
            exit 1
          fi
          echo ">> $TAG matches VERSION $ver"

      - run: ./build.sh

      # Publishing only happens for tag pushes, and only if build.sh above
      # succeeded - steps abort the job on failure, so a broken build can never
      # produce a release. Ordinary pushes still build, they just stop here.
      # Calls the API directly rather than using actions/forgejo-release. That
      # action apt-installs its dependencies, which needs root in a container -
      # this job is host-mode (build.sh requires real paths), so it runs as an
      # unprivileged user and the install fails. curl and python3 are already on
      # the host.
      #
      # RELEASE_TOKEN, not FORGEJO_TOKEN: Forgejo reserves the FORGEJO_, GITEA_
      # and GITHUB_ prefixes for the token it injects automatically, so a secret
      # cannot use them. Needs repository read+write.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: GameAP-GameConfigEditor.wasm
        run: |
          set -euo pipefail
          auth="Authorization: token $TOKEN"
          # Reuse the release if the tag already has one, so re-running a tag
          # updates it rather than failing on a conflict.
          id=$(curl -sS -X POST "$API/releases" -H "$auth" -H 'Content-Type: application/json' -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "$id" ]; then
            id=$(curl -sS "$API/releases/tags/$TAG" -H "$auth" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          for aid in $(curl -sS "$API/releases/$id/assets" -H "$auth" | python3 -c "import json,sys,os; print(' '.join(str(a['id']) for a in json.load(sys.stdin) if a['name']==os.environ['ASSET']))"); do
            curl -sS -X DELETE "$API/releases/$id/assets/$aid" -H "$auth"
          done
          curl -sS --fail-with-body -X POST "$API/releases/$id/assets?name=$ASSET" -H "$auth" -F "attachment=@$ASSET" >/dev/null
          echo ">> published $TAG with $ASSET"

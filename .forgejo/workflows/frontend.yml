name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` on purpose. It makes setup-node talk to the runner's
      # cache server, which hangs the job indefinitely on this self-hosted
      # runner rather than failing. `npm ci` here takes about 4 seconds, so the
      # cache was never buying much. Don't re-add it without checking a run
      # actually completes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # The .wasm build is deliberately NOT run here. build.sh shells out to
  # `docker run` for the Node and TinyGo stages, which means Docker inside the
  # job container - the runner would have to pass its socket through, handing
  # any job root on that host. It is also the wrong machine for it: the build host has
  # Docker and both images cached already. Build releases there with ./build.sh.

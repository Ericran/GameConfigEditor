name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` on purpose. It makes setup-node talk to the runner's
      # cache server, which hangs the job indefinitely on this self-hosted
      # runner rather than failing. `npm ci` here takes about 4 seconds, so the
      # cache was never buying much. Don't re-add it without checking a run
      # actually completes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Needs the `wasm` label: a HOST-mode runner, where steps execute directly on
  # the machine rather than in a job container. That is a requirement, not a
  # preference - build.sh does `docker run -v "$PWD/frontend:/app"`, and from
  # inside a container that path is resolved by the host daemon against the host
  # filesystem, where it does not exist. Host mode makes $PWD a real path, so
  # build.sh behaves exactly as it does when run by hand. The runner also needs
  # Docker, since build.sh drives the Node and TinyGo images.
  #
  # The label names the capability, not a machine, so this file says nothing
  # about where it runs. build.sh puts its caches under the user's cache dir by
  # default, so no path needs configuring here either.
  plugin:
    if: github.event_name != 'pull_request'
    runs-on: wasm
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
